[project]
name = "density"
version = "0.0.1"
description = "Density Phase 0: ROI-weighted HSA step allocation on Wan2.1-T2V-1.3B"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.14.1",
    "diffusers==0.40.0",
    "transformers==5.18.0",
    "numpy==2.2.6",
    "safetensors==0.8.0",
    "accelerate==1.15.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]
# Milestone 4 mask pipeline, Stage A (SAM 2.1, InsightFace SCRFD, WiLoR's YOLO hand detector).
masks = [
    "torchvision==0.29.1",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
    "hydra-core==1.3.7",
    "omegaconf==2.3.1",
    "antlr4-python3-runtime==4.9.3",
    "iopath==0.1.10",
    "insightface==2.1",
    "onnxruntime==1.23.2",
    "onnx==1.23.1",
    "scipy==1.15.3",
    "scikit-image==0.25.2",
    "opencv-python==4.14.0.94",
    "ultralytics==8.4.123",
]
# Milestone 4, Stage B: Detectron2 (Mask R-CNN person boxes) and the vendored Hands23 detector's dependencies.
detectors = [
    "detectron2 @ git+https://github.com/facebookresearch/detectron2.git@1e3e13bbf607b54f62205c4c33922521822fb298",
    "fvcore==0.1.5.post20221221",
    "pycocotools==2.0.11",
    "yacs==0.1.8",
    "tabulate==0.10.0",
    "termcolor==3.3.0",
    "cloudpickle==3.1.2",
    "tensorboard==2.21.0",
    "black==26.10.0",
    "parso==0.8.7",
]
# Milestone 5 metrics: LPIPS v0.1 (AlexNet) and PyAV for the fixed video encoding.
metrics = [
    "av==17.1.0",
    "lpips==0.1.4",
]

[tool.uv]
default-groups = ["dev", "masks", "detectors", "metrics"]
# SAM 2 wants iopath>=0.1.10 and Detectron2 wants <0.1.10; Detectron2 is verified under 0.1.10.
override-dependencies = ["iopath==0.1.10"]
# SAM 2 builds against the installed torch, without its optional CUDA extension.
no-build-isolation-package = ["sam-2", "detectron2"]
extra-build-variables = { sam-2 = { SAM2_BUILD_CUDA = "0" }, detectron2 = { MACOSX_DEPLOYMENT_TARGET = "14.0" } }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/density"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
